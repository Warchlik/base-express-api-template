name: base-express-ts-api-template

services:
  db:
    image: postgres:18.6-alpine3.23
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template -d template']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    container_name: migrate
    restart: 'no'
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgres://template:template@db:5432/template
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: api
    restart: unless-stopped
    ports:
      - '${PORT}:${PORT}'
    env_file: .env
    environment:
      NODE_ENV: prod
      DATABASE_URL: postgres://template:template@db:5432/template
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:$${PORT}/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    container_name: caddy
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      API_UPSTREAM: api:${PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  shared:
  caddy_data:
  caddy_config:
