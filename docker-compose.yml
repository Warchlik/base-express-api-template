name: base-express-ts-api-template

services:
  db:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build:
      context: .
      target: build
    command: pnpm db:migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/template}
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/template}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.31.6-alpine3.24
    container_name: nginx
    restart: unless-stopped
    environment:
      - NGINX_PORT_HTTP=${NGINX_PORT_HTTP}
      - NGINX_PORT_HTTPS=${NGINX_PORT_HTTPS}
      - APP_WEB_NAME=${APP_WEB_NAME}
      - BACKEND_NGINX_PORT=${BACKEND_NGINX_PORT}
      - BACKEND_NGINX_NAME=${BACKEND_NGINX_NAME}
    ports:
      - "${NGINX_PORT_HTTP}:${NGINX_PORT_HTTP}"
      - "${NGINX_PORT_HTTPS}:${NGINX_PORT_HTTPS}"
    volumes:
      - shared:/usr/share/nginx/html
      - ./fullchain.pem:/etc/nginx/conf.d/fullchain.pem
      - ./privkey.pem:/etc/nginx/conf.d/privkey.pem
      - ./nginx.conf:/etc/nginx/templates/default.conf.template
      # - ./docker/nginx-selfsigned.crt:/etc/nginx/conf.d/nginx-selfsigned.crt
      # - ./docker/nginx-selfsigned.key:/etc/nginx/conf.d/nginx-selfsigned.key
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  shared:
